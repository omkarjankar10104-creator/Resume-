name: Build LaTeX Resume

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: deedy_resume-reversed.tex

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: Resume-PDF
          path: deedy_resume-reversed.pdf
